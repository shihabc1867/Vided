<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Vided</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>🎬 Vided</header>

<div id="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <div id="info">প্রথমে ভিডিও বা ছবি দাও</div>
  <progress id="prog" value="0" max="1"></progress>
</div>

<div class="bar">
  <button id="play">▶ প্লে</button>
  <button id="stopb">⏹ স্টপ</button>
  <select id="ratio">
    <option>9:16</option>
    <option>16:9</option>
    <option>1:1</option>
  </select>
</div>

<details open>
  <summary>📁 ফাইল</summary>
  <label>ভিডিও / ছবি</label>
  <input type="file" id="file" accept="video/*,image/*">
  <label>ফ্রেমে বসানো</label>
  <select id="fit">
    <option value="contain">পুরোটা দেখাও (ফিট)</option>
    <option value="fill">ফ্রেম ভরো (ক্রপ)</option>
  </select>
</details>

<details>
  <summary>✂️ ট্রিম</summary>
  <label>শুরু: <b id="tsl">0.0</b> সে.</label>
  <input type="range" id="ts" min="0" max="10" step="0.1" value="0">
  <label>শেষ: <b id="tel">10.0</b> সে.</label>
  <input type="range" id="te" min="0" max="10" step="0.1" value="10">
</details>

<details>
  <summary>🎨 ফিল্টার</summary>
  <select id="preset">
    <option value="">কোনো ফিল্টার নেই</option>
    <option value="grayscale(1)">সাদা-কালো</option>
    <option value="sepia(0.9)">সেপিয়া</option>
    <option value="hue-rotate(180deg)">কুল টোন</option>
    <option value="invert(1)">ইনভার্ট</option>
  </select>
  <label>উজ্জ্বলতা</label>
  <input type="range" id="fb" min="0" max="200" value="100">
  <label>কনট্রাস্ট</label>
  <input type="range" id="fc" min="0" max="200" value="100">
  <label>স্যাচুরেশন</label>
  <input type="range" id="fs" min="0" max="300" value="100">
</details>

<details>
  <summary>🔤 টেক্সট</summary>
  <div class="row">
    <button id="addT">+ নতুন</button>
    <button id="delT">🗑 মুছো</button>
  </div>
  <select id="tl"></select>
  <input id="txt" placeholder="টেক্সট লেখো">
  <label>সাইজ</label>
  <input type="range" id="tsize" min="20" max="200" value="64">
  <label>রঙ</label>
  <input type="color" id="tcol" value="#ffffff">
  <label>দেখা যাবে (সেকেন্ড): শুরু</label>
  <input type="number" id="tfrom" min="0" step="0.1" value="0">
  <label>শেষ</label>
  <input type="number" id="tto" min="0" step="0.1" value="5">
  <small>টেক্সট সরাতে ক্যানভাসে আঙুল দিয়ে টেনে নাও।</small>
</details>

<details>
  <summary>🎵 অডিও</summary>
  <label>ব্যাকগ্রাউন্ড মিউজিক</label>
  <input type="file" id="mfile" accept="audio/*">
  <label>মূল ভিডিওর ভলিউম</label>
  <input type="range" id="vv" min="0" max="200" value="100">
  <label>মিউজিকের ভলিউম</label>
  <input type="range" id="mv" min="0" max="200" value="60">
</details>

<details open>
  <summary>🚀 এক্সপোর্ট</summary>
  <label>ফরম্যাট</label>
  <select id="fmt"></select>
  <label>কোয়ালিটি</label>
  <select id="q">
    <option value="2500000">কম (ছোট ফাইল)</option>
    <option value="5000000" selected>মাঝারি</option>
    <option value="8000000">বেশি</option>
  </select>
  <button id="exp" class="big">এক্সপোর্ট শুরু করো</button>
  <small>এক্সপোর্ট চলার সময় অ্যাপ খোলা রাখো, স্ক্রিন অফ করো না।</small>
  <video id="out" controls playsinline></video>
  <a id="dl" class="big" style="display:none">⬇ ডাউনলোড</a>
</details>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
